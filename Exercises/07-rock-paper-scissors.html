<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="UTF-8">
    <neta name="viewport" content="width=device-width, initial-scale=1"/>
      <title>Rock Paper Scissors</title>
      <style>
  
      </style>
  </head>
  <body>
  <p>Rock Paper Scissors</p>
  <div class="choice">
    <button id="rock" onclick="
     pickComputerMove();
      let result ='';
      if(compMove === 'rock'){
        result = 'You tie.';
      }
      else if(compMove === 'paper'){
        result = 'You lose.';
      }
      else if(compMove === 'scissors'){
        result = 'You win.';
      }

      alert('You picked rock. Computer picked ${compMove}. ${result}');
      ">Rock</button>

    <button id="paper" onclick="
      pickComputerMove();
      
      if(compMove === 'rock'){
        result = 'You win.';
      }
      else if(compMove === 'paper'){
        result = 'You tie.';
      }
      else if(compMove === 'scissors'){
        result = 'You lose.';
      }

      alert('You picked paper. Computer picked ${compMove}. ${result}');
      ">Paper</button>

    <button id="scissors" onclick="
    pickComputerMove();
      
    if(compMove === 'rock'){
      result = 'You lose.';
    }
    else if(compMove === 'paper'){
      result = 'You win.';
    }
    else if(compMove === 'scissors'){
      result = 'You tie.';
    }

    alert('You picked scissors. Computer picked ${compMove}. ${result}');
    ">Scissors</button>


</div>

<div class="results">
  <p>Click here to see the final version of the project</p>
</div>

      <script>

        let compMove = '';

        function pickComputerMove(){
          const randomNumber = Math.random();

          if (randomNumber >= 0 && randomNumber < 1/3){
            compMove = 'rock';
          }
          else if (randomNumber >= 1/3 && randomNumber < 2/3){
            compMove = 'paper';
          }
          else if (randomNumber >= 2/3 && randomNumber <1){
            compMove = 'scissors';
          }
        }
  </script>
  </body>
</html>
