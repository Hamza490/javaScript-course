<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="UTF-8">
    <neta name="viewport" content="width=device-width, initial-scale=1"/>
      <title>Rock Paper Scissors</title>
      <style>
        body{
          background-color: black;
          font-family: Arial;
        }

        h1{
          color: white;
          font-weight: bold;
        }

      p{
        color: white;
      }
      img{
        height: 50px;
        width: 50px;
        margin: 20px;
      }
      
      #rock, #paper, #scissors{
        border: 3px solid white;
        border-radius: 50%;
        background-color: black;
        cursor: pointer;
      }

      #reset,
      .autoplay{
        padding: 10px;
        font-size: 20px;
        cursor: pointer;
      }

      .result{
        font-weight: bold;
        font-size: 30px;
      }

      .score{
        padding-top: 40px;
      }
      </style>
  </head>
  <body>
      <h1>Rock Paper Scissors</h1>
      <div class="choice">
        <button id="rock" onclick="playGame('rock')"><img src="rock-emoji.png"></button>
        <button id="paper" onclick="playGame('paper');"><img src="paper-emoji.png"></button>
        <button id="scissors" onclick="playGame('scissors');"><img src="scissors-emoji.png"></button>

        <p class="result"></p>
        <p class="choices"></p>
        <p class="score"></p>

        <button id="reset" onclick="reset()">Reset Score</button>
        <button class="autoplay" onclick="autoplay();">Auto Play</button> 
      </div>
      <script>
        const score = JSON.parse(localStorage.getItem('score')) || {
            wins: 0,
            losses: 0,
            ties: 0
        }
        
        const scorePara = document.querySelector(".score");
        const resultPara = document.querySelector(".result");
        const choicePara = document.querySelector(".choices");
        const autoPlayBtn = document.querySelector(".autoplay");
        let isAutoPlaying = false;
        let intervalID;

        function autoplay(){
          if(!isAutoPlaying){
            autoPlayBtn.textContent="Stop Playing";
            intervalID = setInterval(()=>{
              playGame(pickComputerMove());
            }, 1000);
            isAutoPlaying=true;
          } else {
            autoPlayBtn.textContent="Auto Play";
            clearInterval(intervalID);
            isAutoPlaying = false;
          }
        }

        function reset(){
          score.wins = 0;
          score.losses = 0;
          score.ties = 0;
          localStorage.removeItem('score');
          resultPara.textContent='';
          choicePara.textContent='';
          scorePara.innerText=`Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
        }

        function playGame(playerMove){
          const computerMove = pickComputerMove();

          let result = '';

          if(playerMove ==='scissors'){
            if(computerMove === 'scissors'){
              result = 'You tie.';
            } else if(computerMove === 'paper'){
              result = 'You win.';
            } else if(computerMove === 'rock'){
              result = 'You lose.';
            }
          } else if(playerMove==='paper'){
            if(computerMove === 'scissors'){
              result = 'You lose.';
            } else if(computerMove === 'paper'){
              result = 'You tie.';
            } else if(computerMove === 'rock'){
              result = 'You win.';
            }
          } else if(playerMove==='rock'){
            if(computerMove === 'scissors'){
              result = 'You win.';
            } else if(computerMove === 'paper'){
              result = 'You lose.';
            } else if(computerMove === 'rock'){
              result = 'You tie.';
            }
          }

          if(result==='You win.'){
            score.wins += 1;
          } else if(result==='You lose.'){
            score.losses += 1;
          } else if(result==='You tie.'){
            score.ties += 1;
          }

          localStorage.setItem('score', JSON.stringify(score));

          resultPara.innerText=`${result}`;
          choicePara.innerText=`You picked ${playerMove}. Computer picked ${computerMove}.`;
          scorePara.innerText=`Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
        }


        function pickComputerMove(){
          const randomNumber = Math.random();

          let compMove = '';

          if (randomNumber >= 0 && randomNumber < 1/3){
            compMove = 'rock';
          } else if (randomNumber >= 1/3 && randomNumber < 2/3){
            compMove = 'paper';
          } else if (randomNumber >= 2/3 && randomNumber <1){
            compMove = 'scissors';
          }

          return compMove;
        }
  </script>
  </body>
</html>
