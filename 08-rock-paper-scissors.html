<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="UTF-8">
    <neta name="viewport" content="width=device-width, initial-scale=1"/>
      <title>Rock Paper Scissors</title>
      <style>
  
      </style>
  </head>
  <body>
      <p>Rock Paper Scissors</p>
      <div class="choice">
        <button id="rock" onclick="playGame('rock')">Rock</button>
        <button id="paper" onclick="playGame('paper');">Paper</button>
        <button id="scissors" onclick="playGame('scissors');">Scissors</button>
        <button id="reset" onclick="reset()">Reset Score</button>
      </div>
      <script>
        const score = JSON.parse(localStorage.getItem('score')) || {
            wins: 0,
            losses: 0,
            ties: 0
        }

        function reset(){
          score.wins = 0;
          score.losses = 0;
          score.ties = 0;
          localStorage.removeItem('score');
        }

        function playGame(playerMove){
          const computerMove = pickComputerMove();

          let result = '';

          if(playerMove ==='scissors'){
            if(computerMove === 'scissors'){
              result = 'You tie.';
            } else if(computerMove === 'paper'){
              result = 'You win.';
            } else if(computerMove === 'rock'){
              result = 'You lose.';
            }
          } else if(playerMove==='paper'){
            if(computerMove === 'scissors'){
              result = 'You lose.';
            } else if(computerMove === 'paper'){
              result = 'You tie.';
            } else if(computerMove === 'rock'){
              result = 'You win.';
            }
          } else if(playerMove==='rock'){
            if(computerMove === 'scissors'){
              result = 'You win.';
            } else if(computerMove === 'paper'){
              result = 'You lose.';
            } else if(computerMove === 'rock'){
              result = 'You tie.';
            }
          }

          if(result==='You win.'){
            score.wins += 1;
          } else if(result==='You lose.'){
            score.losses += 1;
          } else if(result==='You tie.'){
            score.ties += 1;
          }

          localStorage.setItem('score', JSON.stringify(score));

          alert(`You picked ${playerMove}. Computer picked ${computerMove}. ${result}
Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
        }

        function pickComputerMove(){
          const randomNumber = Math.random();

          let compMove = '';

          if (randomNumber >= 0 && randomNumber < 1/3){
            compMove = 'rock';
          } else if (randomNumber >= 1/3 && randomNumber < 2/3){
            compMove = 'paper';
          } else if (randomNumber >= 2/3 && randomNumber <1){
            compMove = 'scissors';
          }

          return compMove;
        }
  </script>
  </body>
</html>
